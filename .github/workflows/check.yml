name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: marketplace manifests are valid and their sources exist
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          bad = []
          for manifest, source in ((".claude-plugin/marketplace.json", lambda e: e["source"]),
                                   (".agents/plugins/marketplace.json", lambda e: e["source"]["path"])):
              entries = json.loads(pathlib.Path(manifest).read_text())["plugins"]
              names = [e["name"] for e in entries]
              if len(names) != len(set(names)):
                  bad.append(f"{manifest}: plugin names are not unique: {names}")
              for e in entries:
                  if not pathlib.Path(source(e)).is_dir():
                      bad.append(f"{manifest}: {e['name']} source {source(e)} is missing")
          print("\n".join(bad) or "manifests OK")
          sys.exit(1 if bad else 0)
          PY

      - name: hooks are valid shell and survive malformed input
        run: |
          for h in $(find products -name '*.sh'); do
            bash -n "$h" || exit 1
            echo 'not json' | bash "$h" >/dev/null 2>&1
            [ $? -le 1 ] || { echo "$h exited $?"; exit 1; }
          done

      # Configuration is data that lands on a user's machine and is theirs to edit, so
      # nothing here inspects its contents. This only proves the product can load it.
      - name: install the core this configuration is for
        # The released Rust binary, fetched and verified the way a user gets it.
        # The Python core reads `ringframe.bundle/1` and refuses this bundle by
        # name, which is the era boundary working rather than a failure.
        run: |
          set -eu
          tag=$(curl -fsSL https://api.github.com/repos/fab7hq/weft/releases/latest |
              sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -n 1)
          archive="fab7-$tag-x86_64-unknown-linux-musl.tar.gz"
          base="https://github.com/fab7hq/weft/releases/download/$tag"
          curl -fsSL -o "$archive" "$base/$archive"
          curl -fsSL -o "$archive.sha256" "$base/$archive.sha256"
          sha256sum -c "$archive.sha256"
          tar -xzf "$archive"
          sudo install -m 755 ringframe /usr/local/bin/ringframe
          rm -f "$archive" "$archive.sha256" ringframe weft
          ringframe --version
      - name: the product can load this configuration
        run: |
          ringframe init --global --from products/ringframe/config
          ringframe deltas domains --json
