# Weft harness file: Muse Code. What Weft needs to start this harness, pick a
# session back up and set its plugin up, and nothing RingFrame reads: RingFrame's
# own facts about it are in its profile. Shipped by fab7; `install.sh` and
# `weft update` copy it into ~/.fab7/weft/harnesses/, replaced on every update.
# Never edit the copy.
title = "Muse Code"
# Not yet tested as fully as the others: Weft says beta beside it in its setup view.
beta = true
program = "muse"
# How a recorded session is opened again; the id is appended.
resume = ["resume"]
# No `transcript`: it prints inline, so the terminal keeps its history.
# Turbo mode, when Weft's config.toml turns it on: no approval and no sandbox,
# and the workspace trusted for the run.
turbo = ["--yolo"]

[config]   # where it keeps its configuration: XDG_CONFIG_HOME/muse, else this. No
# variable names the folder itself, so none is given (Weft reads a variable's
# value as the folder).
default = ".config/muse"

[plugin]   # the argv for each, as Weft's readiness and RingFrame views run them
# Muse reads the fab7 marketplace from Codex's manifest, and installs `rf` from
# the same folder Codex does, by the native manifest Muse finds there
# (.muse-plugin/plugin.json). Its hooks run once approved: Muse asks at its next
# start, or `muse plugins approve rf`.
list = ["plugins", "list", "--json"]
add_marketplace = ["plugins", "marketplace", "add", "fab7", "fab7hq/fab7"]
install = ["plugins", "install", "rf@fab7"]
update_marketplace = ["plugins", "marketplace", "update", "fab7"]
update = ["plugins", "update", "rf"]
# Taking it out again, for a local reinstall.
uninstall = ["plugins", "remove", "rf"]
remove_marketplace = ["plugins", "marketplace", "remove", "fab7"]

[plugin.listing]   # installed plugins under `plugins`, each named by its `plugin.id`, and `active`
installed = ["plugins"]
available = []
name = "plugin.id"
on = ["active"]
want = ["rf"]
