# Weft harness file: Cursor. What Weft needs to start this harness, pick a
# session back up and set its plugin up, and nothing RingFrame reads: RingFrame's
# own facts about it are in its profile. Shipped by fab7; `install.sh` and
# `weft update` copy it into ~/.fab7/weft/harnesses/, replaced on every update.
# Never edit the copy.
title = "Cursor"
# Not yet tested as fully as the others: Weft says beta beside it in its setup view.
beta = true
# Run as `cursor agent`: the Cursor command's agent, which runs Cursor's CLI
# (~/.local/bin/cursor-agent, installed by it when missing). Not the bare
# `agent`, which Grok Build installs too. A person's own path for `cursor` goes
# in `[harnesses.cursor] program` in Weft's config.toml; `args` stay.
program = "cursor"
args = ["agent"]
# How a recorded session is opened again; the id is appended.
resume = ["--resume"]
# No `transcript`: it prints inline, so the terminal keeps its history.
# Turbo mode, when Weft's config.toml turns it on: every command allowed unless a
# rule denies it ("Run Everything").
turbo = ["--yolo"]

[config]   # where it keeps its configuration (agent 2026.09.28: CURSOR_CONFIG_DIR, else ~/.cursor)
env = "CURSOR_CONFIG_DIR"
default = ".cursor"

[plugin]   # argv, as Weft's readiness and RingFrame views run them
# Cursor's CLI lists marketplaces, not plugins, and installs no plugin: `rf` is
# installed from `/plugin` inside Cursor, and its hooks are copied into
# ~/.cursor/hooks.json by the person. What Weft can see is the marketplace, so
# that is what reads as set up, and adding it is the step Weft offers.
list = ["plugin", "marketplace", "list", "--format", "json"]
add_marketplace = ["plugin", "marketplace", "add", "https://github.com/fab7hq/fab7"]
update_marketplace = ["plugin", "marketplace", "update", "fab7"]
# Its listing names marketplaces, so the version is the installed plugin's own:
# Cursor keeps it under plugins/cache/<marketplace>/<plugin>/<commit>/ (agent
# 2026.09.28), and the newest commit's folder is the one in use.
manifest = "plugins/cache/fab7/rf/*/.cursor-plugin/plugin.json"

[plugin.listing]   # how what `list` answers reads: a bare array of marketplaces, named by `name`
installed = ["."]
available = []
name = "name"
want = ["fab7"]
