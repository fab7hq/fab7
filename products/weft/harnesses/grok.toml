# Weft harness file: Grok Build. What Weft needs to start this harness, pick a
# session back up and set its plugin up, and nothing RingFrame reads: RingFrame's
# own facts about it are in its profile. Shipped by fab7; `install.sh` and
# `weft update` copy it into ~/.fab7/weft/harnesses/, replaced on every update.
# Never edit the copy.
title = "Grok Build"
# Not yet tested as fully as the others: Weft says beta beside it in its setup view.
beta = true
# Its installer also links itself as `agent`, Cursor's program name: `grok` is its own.
program = "grok"
# How a recorded session is opened again; the id is appended.
resume = ["--resume"]
# No `transcript`: it is read in the terminal's own scrollback.
# Turbo mode, when Weft's config.toml turns it on: every tool approved without asking.
turbo = ["--always-approve"]

[config]   # where it keeps its configuration
env = "GROK_HOME"
default = ".grok"

[plugin]   # the argv for each, as Weft's readiness and RingFrame views run them
list = ["plugin", "list", "--json"]
add_marketplace = ["plugin", "marketplace", "add", "fab7hq/fab7"]
# An install asks for trust; Weft's step is the person's request for it.
install = ["plugin", "install", "rf@fab7", "--trust"]
update_marketplace = ["plugin", "marketplace", "update", "fab7"]
update = ["plugin", "update", "rf"]
# Taking it out again, for a local reinstall.
uninstall = ["plugin", "uninstall", "rf"]
remove_marketplace = ["plugin", "marketplace", "remove", "fab7"]

[plugin.listing]   # a bare array of installed plugins, named by `name` (`rf`), not `rf@fab7`
installed = ["."]
available = []
name = "name"
want = ["rf"]
