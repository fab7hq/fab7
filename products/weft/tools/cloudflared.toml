# Weft tool file: Cloudflare Tunnel, a tunnel adapter for Weft's Remote.
# Everything Weft knows about this provider: how to start it, how to read its
# address, and where its installation guide is: installing it is the person's.
# TryCloudflare's quick tunnel needs no account and no settings. Shipped by
# fab7; `install.sh` and `weft update` copy it into ~/.fab7/weft/tools/,
# replaced on every update. Never edit the copy.
kind = "tunnel"
title = "Cloudflare Tunnel"
program = "cloudflared"
# What follows the program to start it; {port} is Weft's loopback port.
run = ["tunnel", "--no-autoupdate", "--url", "http://127.0.0.1:{port}"]
# Its address is the first https:// URL in its output whose host ends so.
address = ".trycloudflare.com"
# Said wherever Remote is on: what this tunnel can see.
note = "traffic is decrypted at Cloudflare's edge"
# How the person installs it, opened from Remote's setup.
guide = "https://github.com/fab7hq/fab7/blob/main/products/weft/tools/cloudflared.md"
