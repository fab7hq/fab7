# Weft tool file: Tailscale Funnel, a tunnel adapter for Weft's Remote.
# Everything Weft knows about this provider: how to start it, how to read its
# address, and where its installation guide is: installing it is the person's,
# with `tailscale` on PATH. Funnel puts this machine's port on the internet at
# its stable `<machine>.<tailnet>.ts.net` address; the phone needs no
# Tailscale app. Shipped by fab7; `install.sh`, or a new Weft's first start,
# copies it into ~/.fab7/weft/tools/, replaced on every update. Never edit the copy.
kind = "tunnel"
title = "Tailscale Funnel"
program = "tailscale"
# What follows the program to start it; {port} is Weft's loopback port.
run = ["funnel", "{port}"]
# Its address is the first https:// URL in its output whose host ends so.
address = ".ts.net"
# Said wherever Remote is on: what this tunnel can see.
note = "TLS ends on this machine; Tailscale's relay sees the host name"
# How the person installs it, opened from Remote's setup.
guide = "https://github.com/fab7hq/fab7/blob/main/products/weft/tools/tailscale.md"
