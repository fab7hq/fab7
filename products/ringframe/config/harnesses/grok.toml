# RingFrame host profile: grok (authored configuration; identity = sha256 of canonical JSON)
schema = "ringframe.profile/1"
profile_id = "grok"
host = "grok"
surface = "native-tui"
# No paste_fold_chars: a 2,159-character paste reached its prompt hook whole
# (grok 1.0.52); where its composer folds a paste is not measured, so nothing
# is assumed.

# What the ringframe CLI reads about this harness. How to start it, resume it and
# set its plugin up is not RingFrame's: those are in the harness's own file for
# the tool that runs it. No text to match on its screen, and no hook payload: the CLI
# reads none.
# The name a person reads.
title = "Grok Build"
# The folder names this harness's files go by in a repository (its plugin
# folder): how an Eval links a step that names the harness to its files.
path_names = ["grok"]

# Which tools `ringframe observe tool` makes something of.
[observe]
shell_tool = "run_terminal_command"   # its runs are tool facts

[routing]
precedence = ["native_goal", "native_plan", "native_direct"]

[[capabilities]]
id = "native_goal"
sources = [
  "research/knowledge-base/harnesses/grok/capability.md",
  "https://docs.x.ai/build/modes-and-commands",
]
purpose = "Keeps working until an independent review confirms the goal is met"
activation = {}
continuation = """\
the person submits the prompt; Grok works across rounds and marks the goal \
complete only after an independent evidence review confirms it; otherwise \
the goal stays active or pauses with the gaps it found"""
effects = ["per source intent"]
permission_owner = "host"
delivery_mode = "human_handoff"
prompt_prefix = "/goal "
prompt_prefix_kind = "inline"   # the argument is the objective; status, pause, resume and clear manage it
qualification = {}
limitations = [
  "/goal is user-entered on Grok and on unless goal.enabled or GROK_GOAL turns it off",
  "This profile maps Goal to user submission in the TUI",
  "what the prompt hook receives for a /goal submission is not measured",
  "completion is the evidence review's judgement, which reads only the evidence the agent shows",
]

[[capabilities]]
id = "native_plan"
sources = [
  "research/knowledge-base/harnesses/grok/capability.md",
  "https://docs.x.ai/build/modes-and-commands",
]
purpose = "Plans first in Plan mode; you approve before it changes code"
activation = {}
continuation = """\
the person submits the prompt; Grok's Plan mode researches, writes only the \
session's plan file, and presents the plan with exit_plan_mode; approval \
continues to implementation under host permissions"""
effects = ["workspace_read", "workspace_write"]
permission_owner = "host"
delivery_mode = "human_handoff"
prompt_prefix = "/plan "
prompt_prefix_kind = "mode"   # /plan <text> enters Plan mode and starts a turn with <text>
prompt_prefix_active = "Plan"   # the mode the host shows once it is on
qualification = {}
limitations = [
  "This profile maps Plan to user submission; it does not invoke a mode-transition tool",
  "submission is observed only through the host prompt hook, which receives the prompt without /plan",
  "the plan file lives in Grok's session folder (~/.grok/sessions), not the workspace",
  "native acceptance is not execution or completion",
]

[[capabilities]]
id = "native_direct"
sources = ["research/knowledge-base/harnesses/grok/capability.md"]
purpose = "Does the work now, in this turn"
activation = {}
continuation = "same turn"
effects = ["per source intent"]
permission_owner = "host"
delivery_mode = "native_dispatch"
requires_explicit_request_for_effects = [
  "write",
  "execute",
  "external_effect",
  "workspace_write",
]
qualification = {}
limitations = ["no delivery receipt exists for same-turn continuation"]
