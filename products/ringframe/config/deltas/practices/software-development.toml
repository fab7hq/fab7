# RingFrame practice deltas: software development, the base domain.
schema = "ringframe.deltas/1"
scope = "practice"
domain = "software-development"
description = """\
Building and changing software: design, implementation, refactoring, tests, \
debugging, review, dependencies, and running what you shipped."""
render = { heading = "Rules:" }
source = "https://lawsofsoftwareengineering.com/"

# when: the situation the rule matters in, matched against the request.
# family: scope, simplicity, reuse, testing, cleanup or domain.

# ================= conventions

[[entries]]
id = "practice.kiss"
label = "KISS"
principle = "KISS"
applies_to = { task = ["implement", "plan"] }
when = "The work writes or designs code where a simpler shape could do: new modules, layers, patterns or abstractions."
family = "simplicity"
text = """\
Write readable code: choose clear names and short functions so anyone can \
understand the logic quickly. Avoid over-engineering: do not add design \
patterns or layers of abstraction until they are actually required. Build a \
working solution first and optimize only when performance data proves it \
necessary. Stick to the immediate requirement instead of guessing at future \
needs."""

[[entries]]
id = "practice.yagni"
label = "YAGNI"
principle = "YAGNI"
applies_to = { task = ["implement", "plan"] }
when = "The request could invite extra scope: options, settings, extensibility, 'support for', future cases."
family = "scope"
text = """\
Add a capability only when a present requirement needs it; leave out \
options, parameters, and extension points that nobody has asked for, and \
remove code that no current path uses."""

[[entries]]
id = "practice.gall"
label = "Gall"
principle = "Gall's Law"
applies_to = { task = ["plan", "implement"] }
when = "The work builds a new system or feature that could start as a smaller version running end to end."
family = "simplicity"
text = """\
Start from the simplest version that works end to end and grow it; never \
design the complete system before a simple one runs."""

[[entries]]
id = "practice.goodhart"
label = "Goodhart"
principle = "Goodhart's Law"
applies_to = { task = ["plan", "review"] }
when = "Done is being defined, or progress is measured by a number such as coverage or test count."
family = "testing"
text = """\
Define done by the requirement being met, not by a proxy such as coverage, \
line count, or test count; check the behaviour the requirement describes."""

[[entries]]
id = "practice.boy_scout"
label = "Boy Scout"
principle = "Boy Scout Rule and Broken Windows"
applies_to = { task = ["implement"] }
when = "The change edits existing code that has problems of its own nearby."
family = "cleanup"
text = """\
Leave the code you touch better than you found it; for problems outside what \
the requirement touches, record them instead of fixing them."""

[[entries]]
id = "practice.pesticide"
label = "Pesticide Paradox"
principle = "Pesticide Paradox"
applies_to = { task = ["diagnose", "implement"] }
when = "A fault got past the existing tests."
family = "testing"
text = """\
When a fault escaped the existing tests, add the test that would have caught \
it rather than re-running the ones that did not."""

[[entries]]
id = "practice.murphy"
label = "Murphy"
principle = "Murphy's Law"
applies_to = { task = ["operate", "implement"] }
when = "The work changes live systems, data or deployments, where any step can fail."
family = "testing"
text = """\
Assume every step can fail; verify the current state before changing it and \
name the rollback before the first change."""

# ================= what the request asks for

[[entries]]
id = "practice.stated_constraints"
label = "Stated Constraints"
principle = "agent practice: instruction following"
applies_to = { task = ["implement", "plan", "operate", "document", "clarify", "review"] }
when = "The request sets a limit on the work: files or areas not to touch, no new dependencies, keep an interface, a size or style limit, or words like only, don't, without."
family = "scope"
text = """\
Treat each limit the request sets as a hard check: keep it for the whole \
task, check each one again before you report, and if one blocks the work, \
stop and say so instead of working around it."""
why = """\
Constraint violation is the most common agent failure in real sessions \
(38%, 49% on CLI agents, and rising)."""

[[entries]]
id = "practice.assumptions"
label = "Unstated Choices"
principle = "owner practice"
applies_to = { task = ["plan", "implement", "diagnose"] }
when = "The request leaves the agent a choice with a visible effect: which behaviour, approach, rows or users, what the edge cases do, or what counts as done."
family = "scope"
text = """\
If a wrong guess would be costly to undo or would change what the person \
gets, ask one short question first; otherwise take the conventional choice, \
state it in one line, and go on."""
status = "candidate"   # the abstract form showed no effect; this form is to be evaluated

[[entries]]
id = "practice.answer_only"
label = "Answer Only"
principle = "agent practice: scope"
applies_to = { task = ["question", "research", "review", "diagnose"] }
when = "The request asks a question, or for an explanation, review or diagnosis, and asks for no change."
family = "domain"
text = """\
Answer or report without editing files, committing or running commands that \
change state; offer the change as a next step instead."""
why = """\
Agents treat a question as permission to edit (scope overreach, 10% of \
episodes); understanding code is the most common request (18%)."""

# ================= planning

[[entries]]
id = "practice.ninety_ninety"
label = "Plan in Small Checked Steps"
principle = "Ninety-Ninety Rule, Hofstadter's Law and Pareto Principle"
applies_to = { task = ["plan", "implement"] }
when = "The request asks for a plan, design or breakdown of work, or for a feature that spans several modules or services."
family = "scope"
text = """\
Break the work into small items, each with a done check a command or a named \
person can run; put the thinnest end-to-end path through the riskiest part \
first, and land each item as its own reviewable change."""

[[entries]]
id = "practice.brooks"
label = "Parallel Agents"
principle = "Brooks's Law and Amdahl's Law"
applies_to = { task = ["plan", "implement"] }
when = "The request asks for work to run in parallel, or to hand parts to several agents, sub-agents or worktrees."
family = "scope"
text = """\
Split only along items that touch different files, give each its own branch \
or worktree, keep one implementation per item, and use sub-agents for \
research and review rather than for overlapping edits."""

# ================= writing and changing code

[[entries]]
id = "practice.follow_patterns"
label = "Follow Repo Patterns"
principle = "DRY and Principle of Least Astonishment"
applies_to = { task = ["implement", "document"] }
when = "The request adds another of something the repo already has (an endpoint, component, command, flag, config key, handler, job, test or helper), or names one to copy."
family = "reuse"
text = """\
Find the nearest existing example and follow its structure, names, error \
handling and helpers; reuse what exists instead of writing a near-copy, and \
when a choice would surprise a reader of the surrounding code, take the \
conventional one."""
why = """\
Agent code duplicates instead of reusing (GitClear 2025); reviewers' fixes \
to agent PRs are mostly repo conventions."""

[[entries]]
id = "practice.restructure"
label = "Restructure Without Changing Behaviour"
principle = "Second-System Effect"
applies_to = { task = ["implement", "plan"] }
when = "The request restructures working code without meaning to change what it does: a refactor, internal rename, extract, split or move, a conversion such as callbacks to async, or a port to another framework or language."
family = "cleanup"
text = """\
Keep behaviour the same unless the request says otherwise: make sure tests \
pin the current behaviour before you start, change structure in small steps \
that each pass, add no features on the way, and list any behaviour you did \
change on purpose."""
why = """\
Agent refactors are frequent (26% of agent commits) and patches often \
change more behaviour than needed (PatchDiff)."""

[[entries]]
id = "practice.hyrum"
label = "Compatibility"
principle = "Hyrum's Law"
applies_to = { task = ["implement", "plan", "review"] }
when = "The request changes, removes or renames something existing that other code, people or tools use: a public function, endpoint, CLI command or flag, config key, file or data format, event, or a default."
family = "reuse"
text = """\
Treat current behaviour as depended on: find its callers and users first, \
keep it unless the request says to change it, and name each change you make \
to it with what a caller must do."""

[[entries]]
id = "practice.dependency_change"
label = "Dependency Change"
principle = "Lindy Effect"
applies_to = { task = ["implement", "plan", "research", "operate"] }
when = "The request adds, removes, replaces or upgrades a package, library, SDK, framework or toolchain version."
family = "reuse"
text = """\
Prefer what the repo already uses or a long-maintained package; confirm the \
package exists under that exact name and publisher; read the changelog or \
migration guide between the versions; change it with the repo's package \
manager and lockfile; run the full build and tests."""
why = """\
About 20% of packages LLMs suggest do not exist and the invented names \
recur (Spracklen et al., USENIX Security 2025); upgrades break on unread \
changelogs."""

[[entries]]
id = "practice.map_territory"
label = "Check the Real Tool"
principle = "The Map Is Not the Territory"
applies_to = { task = ["implement", "diagnose", "question", "research", "document"] }
when = "The request depends on a named external library, framework, service API, CLI tool, config option or version."
family = "testing"
text = """\
Confirm the API, option or flag exists in the version this repo pins (the \
lockfile, its docs or source) before using it; trust the running system and \
the repository over memory."""

[[entries]]
id = "practice.knuth"
label = "Measure Before Optimising"
principle = "Premature Optimization"
applies_to = { task = ["implement", "diagnose", "plan"] }
when = "The request is about performance: slowness, latency, memory, CPU, bundle or load time, query time, or the cost of a run."
family = "simplicity"
text = """\
Measure before changing anything, with the same input and command before and \
after; change only the measured bottleneck and report both numbers."""

# ================= tests and failures

[[entries]]
id = "practice.testing_pyramid"
label = "Test the Change"
principle = "Testing Pyramid"
applies_to = { task = ["implement"] }
when = "The request adds or changes code behaviour (a feature, a fix, a new case) or asks for tests to be written."
family = "testing"
text = """\
Write the failing test from the requirement first and make it pass with the \
smallest change; prefer many fast tests against the real unit, mocking only \
boundaries you do not own; add slower integration tests only where a unit \
test cannot see the behaviour."""

[[entries]]
id = "practice.fix_code_not_test"
label = "Fix the Code, Not the Test"
principle = "agent practice: reward hacking"
applies_to = { task = ["implement", "diagnose"] }
when = "The request asks to make failing tests, a build, a type check, lint or CI pass."
family = "testing"
text = """\
Make the checks pass by fixing the code; do not delete, skip, loosen or \
special-case a test or a check. If a test itself looks wrong, stop and say \
why before changing it."""
why = """\
Agents edit or special-case tests to pass them; telling them to stop and \
report a flawed test cut this from ~93% to ~1% (ImpossibleBench)."""

[[entries]]
id = "practice.occam"
label = "Reproduce First"
principle = "Occam's Razor and First Principles"
applies_to = { task = ["diagnose", "implement", "question"] }
when = "The request reports a failure: an error message, a crash, a hang, a failing or flaky test, wrong output, or something that broke after a change."
family = "testing"
text = """\
Reproduce the fault first and reduce it to the smallest case; prefer the \
simplest explanation that fits all the evidence; reason from what the system \
actually does, not from what it is supposed to do."""

[[entries]]
id = "practice.failed_attempt"
label = "Failed Attempt"
principle = "Sunk Cost Fallacy"
applies_to = { task = ["clarify", "diagnose", "implement"] }
when = "The request says an earlier attempt or fix did not work, or the same problem came back."
family = "cleanup"
text = """\
Do not patch the patch: re-check the diagnosis from fresh evidence, say what \
the earlier attempt got wrong, and change approach instead of adding to it."""
why = """\
"Still broken" follow-ups are about 4% of what people send coding agents; \
patching on top of a wrong diagnosis repeats it, and Claude Code's guide \
advises starting over after two failed corrections."""

# ================= review and judgement

[[entries]]
id = "practice.linus"
label = "Review Findings"
principle = "Linus's Law"
applies_to = { task = ["review"] }
when = "The request asks to review a diff, branch, pull request, commit, plan or design."
family = "testing"
text = """\
Review as an independent reader against the requirement, not the \
description; report findings that affect correctness first, each with the \
concrete way it fails, skip style unless asked, and say so when you find \
nothing."""

[[entries]]
id = "practice.confirmation_bias"
label = "Check the Conclusion"
principle = "Confirmation Bias and Dunning-Kruger"
applies_to = { task = ["question", "research", "review", "clarify"] }
when = "The request asks for a judgement about the code or system: whether something is safe, still used, correct or finished, how it works, or which option is better."
family = "testing"
text = """\
Look for the evidence that would prove you wrong before concluding; keep \
what you observed apart from what you inferred, and state your confidence."""

# ================= risk: outside data, lasting changes, history

[[entries]]
id = "practice.untrusted_input"
label = "Untrusted Input"
principle = "Postel's Law, revised (RFC 9413)"
applies_to = { task = ["implement", "review"] }
when = "The change handles data from outside the program (request bodies, uploads, files from users or third parties, webhooks, CLI arguments, user input), or changes code that handles login, permissions, tokens or secrets."
family = "domain"
text = """\
Validate outside data strictly and reject what the contract forbids with a \
clear error; never build SQL, shell commands or paths from it unescaped; \
keep secrets out of code, logs and errors; check access on every path."""
why = """\
LLM code is insecure in 45% of tasks (Veracode 2025); vibe-coded commits \
add 3.8x more findings (SWE-chat)."""

[[entries]]
id = "practice.unintended_consequences"
label = "Hard to Undo"
principle = "Law of Unintended Consequences"
applies_to = { task = ["implement", "operate", "plan"] }
when = "The request changes something hard to undo: stored data or a schema migration, a deploy or release, shared infrastructure or cloud resources, or deleting files or records."
family = "scope"
text = """\
Check the current state first, name the rollback before the first change, \
prefer a dry run or a backup, change one thing at a time, and stop to ask \
before any step that cannot be undone."""
why = """\
The rare severe agent failures are irreversible: a deleted production \
database, rewritten history, an unapproved release."""

[[entries]]
id = "practice.git_changes"
label = "Git Changes"
principle = "agent practice: version control"
applies_to = { task = ["operate", "implement"] }
when = "The request asks to commit, branch, merge, rebase, push, tag, or open or update a pull request."
family = "cleanup"
text = """\
Stage only this task's files and read the staged diff for secrets and stray \
files; say what changed and why; never push, force, rewrite shared history, \
or discard uncommitted work unless the request says to."""
why = """\
Git is 12.6% of prompts (SWE-chat); rewriting history and deleting \
uncommitted work are among the severe real failures."""
