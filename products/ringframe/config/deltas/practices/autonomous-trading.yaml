# Seed for ~/.fab7/rf/config/deltas/practices/autonomous-trading.yaml;
# project overrides use the matching .fab7/rf path.
schema: ringframe.deltas/1
scope: practice
domain: autonomous-trading
description: >-
  Trading strategies and the systems that run them: signals and indicators,
  backtests, market and reference data, order execution and routing, positions
  and risk limits, broker or exchange integration, and live or paper trading
  operations.
render:
  heading: 'Rules:'
  core_cap: 4   # additive to the software-development base; see spec §8
source: https://www.fia.org/sites/default/files/2024-07/FIA_WP_AUTOMATED%20TRADING%20RISK%20CONTROLS_FINAL_0.pdf
concerns: [strategy_research, backtest, data_pipeline, execution, order_routing,
           risk_limits, position_sizing, live_deploy, monitoring, reconciliation,
           broker_integration, cost_model, operate]
entries:
  # ================= research validity
  - id: practice.no_lookahead
    label: No Lookahead
    principle: Point-in-Time Discipline
    applies_to:
      task: [research, plan, implement, review]
    tier: core
    priority: 10
    text: >-
      Keep two timestamps for every input, when the event occurred and when it
      became available, and let a decision use only information available at
      decision time. Model execution after signal availability plus the
      applicable latency. A completed bar's close is available for the next
      decision; a window that ends at the current completed observation is
      not a leak. A value that was revised, restated, or not yet published at
      decision time is.
    why: >-
      The bias is using information before it could have been known, not
      using recent information. Freqtrade's own non-biased example is a
      rolling window that includes the current row.

  - id: practice.walk_forward
    label: Walk Forward
    principle: Walk-Forward Validation
    applies_to:
      task: [research, plan]
    tier: core
    priority: 20
    text: >-
      Freeze a chronological evaluation procedure before running it: fit on
      earlier data, evaluate on later data, roll forward, purge overlapping
      label periods and apply an embargo where labels span time. Report the
      per-window results and their dispersion against acceptance criteria you
      set in advance, rather than either averaging windows together or
      declaring every inconsistency a failure.

  - id: practice.locked_oos
    label: Locked OOS
    principle: Locked Out-of-Sample
    applies_to:
      task: [research, plan, diagnose, review]
    priority: 30
    concerns: [strategy_research, backtest]
    text: >-
      Freeze the strategy, its parameters, and any retraining procedure before
      the final held-out evaluation; a frozen adaptive procedure may retrain on
      earlier data inside that evaluation. Once a held-out result has
      influenced a design choice it is development evidence, not a test.
      Record that it happened and obtain fresh data before claiming a result.

  - id: practice.no_repaint
    label: No Repaint
    applies_to:
      task: [research, implement, diagnose, review]
    concerns: [strategy_research, backtest, data_pipeline]
    text: >-
      Require every signal to be causal: reproducible later from exactly the
      information that was available when it fired. Test it by extending the
      history with identical input versions and initialization and checking
      that earlier signals are unchanged. Data corrections and updates to an
      unfinished bar are legitimate revisions; keep them as separate versions
      so the signal actually acted on is never overwritten.

  - id: practice.indicator_warmup
    label: Indicator Warmup
    applies_to:
      task: [research, implement, review]
    concerns: [strategy_research, backtest, data_pipeline]
    text: >-
      State each indicator's required history and valid-input conditions and
      emit no signal until both hold; never fill missing early values into a
      tradable signal. Fix the evaluation start date before running, so that
      excluding the warm-up span cannot be used to hide losses.

  - id: practice.survivorship
    label: Survivorship
    principle: Survivorship Bias
    applies_to:
      task: [research, implement, review]
    concerns: [backtest, data_pipeline, strategy_research]
    text: >-
      Build the universe from point-in-time membership as of each historical
      date, and retain delisted, merged, and failed instruments together with
      their economic outcomes; never backtest a current index membership over
      a past period.

  - id: practice.corporate_actions
    label: Corporate Actions
    applies_to:
      task: [research, implement, diagnose, review]
    concerns: [data_pipeline, backtest, strategy_research]
    text: >-
      Keep adjusted research series distinct from executable prices and from
      actual cash and share accounting; state which adjustment convention each
      series uses and never count a dividend both as a price adjustment and as
      cash. Preserve a stable instrument identity across ticker changes.
      Treat a sudden outsized move as a suspected unhandled action until
      checked.

  - id: practice.session_time
    label: Sessions
    applies_to:
      task: [research, implement, diagnose, review]
    concerns: [data_pipeline, backtest, execution]
    text: >-
      Store timestamps with an explicit timezone and align them to the venue's
      session rather than the calendar day, including overnight and
      continuous sessions, holidays, half days, and daylight-saving shifts.
      Never assume the session boundary is midnight in your local zone.

  - id: practice.cost_realism
    label: Cost Realism
    applies_to:
      task: [research, implement, review]
    priority: 40
    concerns: [backtest, cost_model, execution]
    text: >-
      Account for every cost exactly once — commission, spread, slippage,
      impact, and financing or borrow — whether it is embedded in the fill
      price or charged separately; do not mechanically subtract a full spread
      on every fill. Stress the assumptions and report the cost level at which
      the edge disappears.

  - id: practice.multiple_testing
    label: Multiple Testing
    principle: Selection Bias
    applies_to:
      task: [research, review]
    concerns: [strategy_research, backtest]
    text: >-
      Record the full search history, including configurations that were
      tried and rejected, and adjust the selected result for selection bias
      with a method that accounts for the number of trials, their dependence,
      and the return distribution, such as the deflated Sharpe ratio. A high
      Sharpe found after many searches is evidence of search until adjusted.

  - id: practice.param_stability
    label: Parameter Stability
    applies_to:
      task: [research, plan, review]
    concerns: [strategy_research, backtest]
    text: >-
      Perturb each parameter by economically meaningful amounts and report how
      performance responds; investigate sensitivity you cannot explain and
      prefer settings inside a stable region over an isolated peak.

  - id: practice.regime
    label: Regime
    applies_to:
      task: [research, plan, operate, review]
    concerns: [strategy_research, monitoring]
    text: >-
      State the market condition the edge assumes, the observable criteria
      that would show it no longer holds, and the response to each, all
      defined in advance; allow for uncertainty and false alarms in those
      criteria rather than treating one breach as proof.

  # ================= execution safety
  - id: practice.kill_switch
    label: Kill Switch
    applies_to:
      task: [plan, implement, operate, review]
    tier: core
    priority: 10
    concerns: [execution, live_deploy, risk_limits, operate]
    text: >-
      Provide a halt that runs independently of the strategy process, blocks
      the affected strategy's new submissions, handles its working orders by
      a stated policy, and persists across restart. Halting is not
      flattening: specify separately whether and how exposure is reduced,
      which risk-reducing orders remain permitted, and who may authorize
      resumption. Verify the halt from a separate process before live risk.

  - id: practice.idempotent_orders
    label: Idempotent Orders
    applies_to:
      task: [implement, review]
    tier: core
    priority: 20
    concerns: [execution, order_routing, broker_integration]
    text: >-
      Persist one identifier per logical order intent before submitting and
      reuse it on every retry and during recovery; confirm the venue's
      duplicate and lookup semantics for that identifier. Treat a timeout as
      an unknown outcome to be looked up, never as a failure to resubmit.
      Deduplicate fills by execution identity, not by order identity alone.

  - id: practice.pretrade_limits
    label: Pre-Trade Limits
    applies_to:
      task: [plan, implement, operate, review]
    tier: core
    priority: 30
    concerns: [risk_limits, position_sizing, execution]
    text: >-
      Check every order and every amendment in the path before submission
      against per-order size, price tolerance, resulting position and
      notional including outstanding orders, and order rate; monitor
      mark-to-market loss continuously against its limit. A breach rejects
      the order and raises an alert rather than clamping it silently, and the
      policy states which risk-reducing orders remain allowed after a breach.

  - id: practice.reconciliation
    label: Reconciliation
    applies_to:
      task: [implement, operate, review]
    priority: 40
    concerns: [reconciliation, monitoring, broker_integration, execution, operate]
    text: >-
      Compare internal positions, cash, and open orders against fresh venue
      records on a stated schedule, on every restart, and after recovery, with
      explicit timing and tolerances. Resolve a discrepancy without
      overwriting either record, and block risk-increasing orders for the
      affected instruments while exposure is uncertain; do not stop unrelated
      strategies for it.

  - id: practice.partial_fills
    label: Partial Fills
    applies_to:
      task: [implement, diagnose, review]
    concerns: [execution, order_routing, reconciliation]
    text: >-
      Reserve the full intended exposure before submission, then update
      filled and remaining quantity from the venue's own fill, cancel, and
      correction events correlated to your order identifier, and recompute
      exposure and risk distance after each event as well as before
      submission.

  - id: practice.feed_recovery
    label: Feed Recovery
    applies_to:
      task: [implement, operate, review]
    concerns: [data_pipeline, execution, broker_integration, monitoring]
    text: >-
      Assume the connection drops. Heartbeat the stream, reconnect with
      backoff, then recover to a consistent state by taking a fresh snapshot
      and replaying events from it before acting, so missed messages are
      repaired rather than inferred. Schedule requests within the venue's
      rate limits and give cancellations priority over new submissions.

  - id: practice.stale_data
    label: Stale Data
    applies_to:
      task: [implement, operate, review]
    concerns: [data_pipeline, execution, monitoring]
    text: >-
      Detect data that is stale, gapped, out of order, or invalid, and block
      any decision that depends on it. State separately how existing
      positions are managed while data is unavailable; stale data must not
      implicitly liquidate a position or disable an unrelated safety control.
      Record every gap.

  - id: practice.paper_first
    label: Paper First
    applies_to:
      task: [plan, operate]
    concerns: [live_deploy, execution]
    text: >-
      Run the whole path in paper before live to exercise order construction,
      state transitions, scheduling, and monitoring, and deliberately test
      retries and failures there. A successful paper run establishes the
      integration path, not live execution quality: fills, queue position,
      and partial-fill behaviour are not shown by it.

  # ================= capital discipline
  - id: practice.risk_per_trade
    label: Risk Budget
    applies_to:
      task: [implement, plan, review]
    concerns: [position_sizing, risk_limits]
    text: >-
      State a risk budget for each position and for the portfolio, including
      correlated losses and adverse execution, and size within it; a stop or
      invalidation level is an assumption about the exit, not a guaranteed
      maximum loss. Never size from conviction or from the last result.

  - id: practice.fractional_sizing
    label: Fractional Sizing
    applies_to:
      task: [research, implement, plan, review]
    concerns: [position_sizing, risk_limits, strategy_research]
    text: >-
      Size conservatively for uncertainty in estimated returns, volatility,
      and dependence. If using Kelly, state the estimation assumptions and the
      chosen fraction; enforce position, leverage, and portfolio risk limits
      independently of the sizing method.
    why: >-
      Estimated optimal sizing is sensitive to estimation error. Fractional
      Kelly reduces exposure relative to full Kelly but does not guarantee
      acceptable drawdowns.

  - id: practice.leverage_carry
    label: Leverage
    applies_to:
      task: [implement, plan, operate, review]
    concerns: [risk_limits, position_sizing, execution]
    text: >-
      For leveraged, margined, or borrowed positions, state the exposure, the
      applicable margin requirements, the financing and borrow costs, and the
      forced-close conditions. Stress adverse price moves and margin changes,
      and monitor available collateral as prices, positions, costs, and
      requirements change.

  - id: practice.drawdown_stop
    label: Drawdown Stop
    applies_to:
      task: [plan, operate, review]
    concerns: [risk_limits, monitoring, operate]
    text: >-
      Before going live, define the drawdown limit with its equity basis,
      high-water mark, measurement frequency, treatment of open positions at
      the limit, and who may authorize a restart. When it is breached, record
      the decision; do not widen the limit to avoid it.

  # ================= operations
  - id: practice.audit_trail
    label: Audit Trail
    applies_to:
      task: [implement, operate, review]
    concerns: [monitoring, reconciliation, operate]
    text: >-
      Record decision-time inputs, the strategy, model, and configuration
      versions in force, each decision, each order with its acknowledgements
      and fills, and each parameter change, so any past action can be
      explained from stored data. Aim for an explainable reconstruction, not
      a promise to replay every computation bit for bit.

  - id: practice.one_live_change
    label: One Live Change
    principle: Law of Unintended Consequences
    applies_to:
      task: [operate, implement, review]
    concerns: [live_deploy, operate]
    text: >-
      Prefer one bounded, attributable change at a time in live, with the
      observation window and rollback criteria stated before deploying. When
      changes must be coupled, or a repair is urgent, document the coupling
      and its rollback rather than pretending the changes are independent.
