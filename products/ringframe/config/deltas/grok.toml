# RingFrame route rules for Grok Build. Rendered by the CLI only when `status = "qualified"`;
# every entry here is a candidate until a HostLab qualification
# (ringframe-route-rules-q01's design) passes on this host.
# A route rule says what the turn delivers, the order of the work, when it
# stops and what it shows; practice rules say what good work looks like.
# What each rule rests on: research/knowledge-base/harnesses/grok/capability.md.
schema = "ringframe.deltas/1"
scope = "host"
host = "grok"

[[entries]]
id = "grok.native_plan.plan_as_files"
label = "Plan As Files"
status = "candidate"
capability = "native_plan"
applies_to = { result = ["plan"] }
text = """\
Draft the plan in Plan mode and present it with exit_plan_mode. Once it is \
approved, write it into the repository at plans/<slug>/plan.md with the \
sequence and what done means for each step, plans/<slug>/adr/ with one file \
per decision, plans/<slug>/spec/ with one per contract. Then stop; building \
it is a later request."""
why = """\
Grok's Plan mode writes the plan to its own session folder, outside the \
repository, and approval continues into execution: without this, the plan is \
lost to the project and the approved plan gets built."""
matrix_ref = "https://docs.getfab7.com/ringframe/harnesses/grok#ask"

[[entries]]
id = "grok.native_plan.after_approval"
label = "After Approval"
status = "candidate"
capability = "native_plan"
applies_to = { result = ["workspace_change"] }
text = """\
Present the plan with exit_plan_mode, naming the checks that will show the \
work is done before its steps. Once it is approved, carry it out in this \
session, run those checks, and confirm every requested file exists before \
you finish."""
why = "Approval continues into execution; checks named in the plan make both the review and the finish concrete."
matrix_ref = "https://docs.getfab7.com/ringframe/harnesses/grok#ask"

[[entries]]
id = "grok.native_direct.show_checks"
label = "Show Checks"
status = "candidate"
capability = "native_direct"
applies_to = { result = ["workspace_change"] }
text = """\
Before your final message, run the checks that show the change works, \
report each command with its result, and list the files you changed."""
why = "Same-turn work has no receipt; the final message is the only record of what was checked."
matrix_ref = "https://docs.getfab7.com/ringframe/harnesses/grok#ask"
