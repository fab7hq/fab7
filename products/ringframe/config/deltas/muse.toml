# RingFrame route rules for Muse Code. Rendered by the CLI only when `status = "qualified"`;
# every entry here is a candidate until a HostLab qualification
# (ringframe-route-rules-q01's design) passes on this host.
# A route rule says what the turn delivers, the order of the work, when it
# stops and what it shows; practice rules say what good work looks like.
# What each rule rests on: research/knowledge-base/harnesses/muse/capability.md.
schema = "ringframe.deltas/1"
scope = "host"
host = "muse"

[[entries]]
id = "muse.native_plan.plan_as_files"
label = "Plan As Files"
status = "candidate"
capability = "native_plan"
applies_to = { result = ["plan"] }
text = """\
This request asks for the plan as files: write plans/<slug>/plan.md with the \
sequence and what done means for each step, plans/<slug>/adr/ with one file \
per decision, plans/<slug>/spec/ with one per contract; then stop. Building \
it is a later request, not a go."""
why = """\
Muse's /plan skill returns one inline plan and writes no plan file unless \
the request asks for one; an inline plan can be checked by nobody, and a \
go would start building it."""
matrix_ref = "https://docs.getfab7.com/ringframe/harnesses/muse#ask"

[[entries]]
id = "muse.native_plan.after_approval"
label = "After Approval"
status = "candidate"
capability = "native_plan"
applies_to = { result = ["workspace_change"] }
text = """\
End the plan with the checks that will show the work is done. When the \
person replies go, carry it out, run those checks, and confirm every \
requested file exists before you finish."""
why = "/plan stops for approval and go carries the plan out in the same session; named checks make both the review and the finish concrete."
matrix_ref = "https://docs.getfab7.com/ringframe/harnesses/muse#ask"

[[entries]]
id = "muse.native_goal.step_loop"
label = "Step Loop"
status = "candidate"
capability = "native_goal"
applies_to = { result = ["workspace_change"] }
# It works a plan, so the prompt must name one the workspace holds, by path.
names_plan = true
text = """\
Work the plan's steps one at a time, in its order. Per step: read the code \
it touches against the step, make the change test-first, then review the \
diff against the step."""
why = """\
A persistent objective needs an iteration shape; the owner's loop is \
analyze, TDD, review. Outcome judgement belongs to rf-eval."""
matrix_ref = "https://docs.getfab7.com/ringframe/harnesses/muse#ask"

[[entries]]
id = "muse.native_goal.done_check"
label = "Done Check"
status = "candidate"
capability = "native_goal"
text = """\
After each step report progress: the step, the check you ran and its \
result, and what remains. Done when every step has a passing check; or \
when a step needs the owner, reported as `BLOCKED: <step>: <question>`, \
which also ends the goal."""
why = """\
A Muse goal is tracked by the session, and how it ends was not observed; \
progress reports make the end checkable, and a blocked exit gives a step \
that needs the owner one."""
matrix_ref = "https://docs.getfab7.com/ringframe/harnesses/muse#ask"

[[entries]]
id = "muse.native_direct.show_checks"
label = "Show Checks"
status = "candidate"
capability = "native_direct"
applies_to = { result = ["workspace_change"] }
text = """\
Before your final message, run the checks that show the change works, \
report each command with its result, and list the files you changed."""
why = "Same-turn work has no receipt; the final message is the only record of what was checked."
matrix_ref = "https://docs.getfab7.com/ringframe/harnesses/muse#ask"
