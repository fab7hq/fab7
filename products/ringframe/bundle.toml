# RingFrame's configuration. `ringframe init --global` copies config/ into
# ~/.fab7/rf/config/, and `ringframe sync` replaces it; never edit the copy.
# Overrides arrive with `--override`, from a person or a tool that runs
# RingFrame.
# The release version is this repository's tag, not a field here.
#
# A RingFrame installs the newest release whose
# schema it reads and whose `[requires] ringframe` is not newer than itself,
# and passes the others over. `/2` is the Rust era: a 0.0.5 core reads `/1`
# and refuses this bundle by name.
schema = "ringframe.bundle/2"
product = "ringframe"
config_home = "rf"

# The oldest RingFrame that runs with this release.
[requires]
ringframe = "0.8.0"
