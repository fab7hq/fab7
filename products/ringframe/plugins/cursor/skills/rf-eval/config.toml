# RingFrame Eval, for Cursor. Shipped with the plugin and replaced on update.
# Each role's model and effort are its agent definition's, in this plugin's
# agents/ folder (rf-map, rf-reduce, rf-confirm); change a tier there, or for
# one Eval with role=model/effort words.
[eval]
# Tasks out at once. Not measured on Cursor, which documents no sub-agent
# limit: a cautious start. Raise it only with a measurement.
parallel = 3
