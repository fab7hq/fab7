# RingFrame Eval, for Muse Code. Shipped with the plugin and replaced on update.
# Each role's model and effort are its agent definition's, in this plugin's
# agents/ folder (rf-map, rf-reduce, rf-confirm); change a tier there, or for
# one Eval with role=model/effort words.
[eval]
# Tasks out at once. Not measured on Muse: an agent tree holds eight agents
# by default, and a spawn into a full tree is rejected. A cautious start.
parallel = 3
